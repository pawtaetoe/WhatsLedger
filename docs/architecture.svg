<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; rx: 10; }
      .meta { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 1.5; rx: 10; }
      .core { fill: #ecfdf3; stroke: #16a34a; stroke-width: 1.5; rx: 10; }
      .pack { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 10; }
      .h { font-size: 16px; font-weight: bold; fill: #111827; }
      .t { font-size: 12.5px; fill: #374151; }
      .l { font-size: 11.5px; fill: #6b7280; font-style: italic; }
      .ln { stroke: #4b5563; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="960" height="600" fill="#f9fafb"/>

  <rect class="box" x="20" y="40" width="160" height="90"/>
  <text class="h" x="36" y="68">WhatsApp</text>
  <text class="t" x="36" y="90">text, voice note,</text>
  <text class="t" x="36" y="107">photo or a tap</text>

  <rect class="box" x="215" y="40" width="160" height="90"/>
  <text class="h" x="231" y="68">Transport</text>
  <text class="t" x="231" y="90">Twilio sandbox or</text>
  <text class="t" x="231" y="107">WhatsApp Cloud API</text>

  <rect class="box" x="410" y="40" width="160" height="90"/>
  <text class="h" x="426" y="68">FastAPI webhook</text>
  <text class="t" x="426" y="90">signed, no duplicates,</text>
  <text class="t" x="426" y="107">replies at once</text>

  <rect class="core" x="605" y="40" width="150" height="90"/>
  <text class="h" x="621" y="68">Router</text>
  <text class="t" x="621" y="90">buttons and words first,</text>
  <text class="t" x="621" y="107">then one model read</text>

  <rect class="core" x="790" y="40" width="150" height="290"/>
  <text class="h" x="806" y="68">Handlers</text>
  <text class="t" x="806" y="94">log, voice, receipts</text>
  <text class="t" x="806" y="116">ask with tools</text>
  <text class="t" x="806" y="138">plans, can I afford it</text>
  <text class="t" x="806" y="160">upcoming bills</text>
  <text class="t" x="806" y="182">group bill, fix items</text>
  <text class="t" x="806" y="204">claim by numbers</text>
  <text class="t" x="806" y="226">PayNow, I've paid</text>
  <text class="t" x="806" y="248">main currency</text>
  <text class="t" x="806" y="270">dashboard link</text>

  <rect class="box" x="215" y="170" width="160" height="100"/>
  <text class="h" x="231" y="198">Reminder loop</text>
  <text class="t" x="231" y="220">every 15 seconds:</text>
  <text class="t" x="231" y="238">bills due, bill nudges,</text>
  <text class="t" x="231" y="256">auto close</text>

  <rect class="meta" x="410" y="170" width="345" height="100"/>
  <text class="h" x="426" y="198">Meta Model API</text>
  <text class="t" x="426" y="222">Muse Spark: read messages, receipts, tool calls,</text>
  <text class="t" x="426" y="240">claims in words, custom plans</text>
  <text class="t" x="426" y="258">Muse Voice Transcribe: voice notes, as wav by ffmpeg</text>

  <rect class="box" x="215" y="300" width="160" height="90"/>
  <text class="h" x="231" y="328">Exchange rates</text>
  <text class="t" x="231" y="350">exchangerate-api and</text>
  <text class="t" x="231" y="368">two free fallbacks,</text>
  <text class="t" x="231" y="384">cached 12 hours</text>

  <rect class="pack" x="410" y="300" width="345" height="90"/>
  <text class="h" x="426" y="328">Region packs, by phone number</text>
  <text class="t" x="426" y="350">+65: SGD, local words, PayNow QR, MAS loan rules</text>
  <text class="t" x="426" y="368">every number: its country's currency and timezone</text>

  <rect class="box" x="215" y="430" width="540" height="110"/>
  <text class="h" x="231" y="458">Web pages (Jinja and HTMX), opened from signed links</text>
  <text class="t" x="231" y="482">claim page: tick your dishes, autosaves · fix the items: edit a misread bill</text>
  <text class="t" x="231" y="500">dashboard: who owes whom, I've paid, bills, this month</text>
  <text class="t" x="231" y="518">plan form: every choice on one page</text>

  <rect class="box" x="790" y="430" width="150" height="110"/>
  <text class="h" x="806" y="458">Postgres</text>
  <text class="t" x="806" y="482">users, expenses</text>
  <text class="t" x="806" y="500">ledgers in cents</text>
  <text class="t" x="806" y="518">bills, claims, plans</text>

  <path class="ln" d="M180 85 H213"/>
  <path class="ln" d="M375 85 H408"/>
  <path class="ln" d="M570 85 H603"/>
  <path class="ln" d="M755 85 H788"/>
  <path class="ln" d="M790 220 H757"/>
  <path class="ln" d="M790 320 H757"/>
  <path class="ln" d="M865 330 V428"/>
  <path class="ln" d="M295 170 V132"/>
  <path class="ln" d="M755 485 H788"/>
  <path class="ln" d="M295 430 V392"/>
  <path class="ln" d="M392 430 V150 H360 V132"/>
  <path class="ln" d="M100 130 V485 H213"/>
  <path class="ln" d="M215 120 L180 120"/>
  <text class="l" x="108" y="300">link or button</text>
  <text class="l" x="108" y="315">opens the page</text>
  <text class="l" x="20" y="160">replies and buttons</text>
  <text class="l" x="20" y="575">The models read. Python checks every number before it is saved. Pages and the loop message people through the transport too.</text>
</svg>
